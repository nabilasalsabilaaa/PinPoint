[pytest]
testpaths = api
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    auth: Modul Autentikasi (FR-01 s.d. FR-04)
    categories: Modul Master Kategori (UC-09, NFR-17)
    e2e: Alur End-to-End Laporan (User -> Admin -> Pemerintah)
    security: Pengujian Keamanan JWT & RBAC (NFR-06, NFR-07)
    performance: Pengujian Waktu Respons API (NFR-01, NFR-02)
